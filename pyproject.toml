[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptlabel"
version = "0.1.0"
description = "Etikettenprogramm für Brother P-touch Drucker (PT-P750W) unter Linux"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "Pillow>=10",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.gui-scripts]
ptlabel = "ptlabel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
